<style>
:root {
  font-family: Arial, Helvetica, sans-serif;
  background: #eef4fa;
  color: #173452;
}
* { box-sizing: border-box; }
body { margin: 0; background: #eef4fa; }
header {
  background: linear-gradient(120deg,#082b50,#1265a3);
  color: white;
  padding: 22px max(18px,calc((100vw - 1150px)/2));
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  border-bottom: 4px solid #53b9e8;
}
header strong { font-size: 22px; letter-spacing: 1px; }
header small { color: #d5edff; }
h1 { font-size: clamp(27px,4vw,43px); margin: 12px 0; }
h2 { color: #104c7d; margin: 0 0 16px; }
h3 { color: #17649b; }
small,p { color: #617b93; }
header small { color: #d5edff; }
main { max-width: 1150px; margin: auto; padding: 24px 18px; }
.hero {
  background: linear-gradient(120deg,#0b3967,#1685bd);
  color: white;
  border-radius: 18px;
  padding: 35px;
  margin-bottom: 20px;
  box-shadow: 0 8px 22px #17345220;
}
.hero small,.hero p { color: #e0f3ff; }
.hero h1 { color: white; }
.panel {
  background: white;
  border: 1px solid #d6e4f0;
  border-radius: 15px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 4px 14px #1734520c;
}
button {
  background: #0879b9;
  border: 0;
  border-radius: 8px;
  padding: 11px 16px;
  font-weight: 700;
  cursor: pointer;
  color: white;
}
button:hover { background: #075b91; }
button.alt { background: #e2f1fb; color: #104c7d; }
.tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 20px 0;
}
.tabs button { background: #dceaf5; color: #16466d; }
.tabs button.active { background: #0879b9; color: white; }
.hidden { display: none !important; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(190px,1fr));
  gap: 14px;
}
.grid>div {
  background: white;
  border: 1px solid #d6e4f0;
  padding: 20px;
  border-radius: 13px;
  box-shadow: 0 4px 14px #1734520c;
}
.big { font-size: 32px; font-weight: 800; color: #0879b9; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
td,th { border-bottom: 1px solid #e0eaf2; padding: 12px 9px; text-align: left; }
th { color: #17649b; font-size: 12px; background: #edf5fb; }
td.n,th.n { text-align: center; }
.match {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  border-bottom: 1px solid #e0eaf2;
  padding: 14px 0;
  color: #173452;
}
.match b { font-size: 21px; color: #0879b9; }
.match span { flex: 1; }
.match span:last-child { text-align: right; }
.form {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(170px,1fr));
  gap: 12px;
}
label { display: grid; gap: 5px; font-size: 13px; color: #45637e; }
input,select,textarea {
  background: white;
  color: #173452;
  border: 1px solid #c5d7e6;
  border-radius: 8px;
  padding: 11px;
  width: 100%;
  font: inherit;
}
input:focus,select:focus,textarea:focus {
  outline: 2px solid #8bd2f2;
  border-color: #0879b9;
}
textarea { min-height: 85px; }
.wide { grid-column: 1/-1; }
.status {
  padding: 12px;
  border-radius: 8px;
  background: #e0f2fb;
  color: #14557e;
  margin: 12px 0;
}
.error { background: #fbe5e5; color: #9b2525; }
footer { text-align: center; color: #617b93; padding: 25px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.doc-card {
  background: #f5f9fc;
  border: 1px solid #d6e4f0;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 12px;
}
.doc-card a { color: #0879b9; }
@media(max-width:600px) {
  header { padding: 15px; }
  header strong { font-size: 17px; }
  .hero { padding: 24px 18px; }
  .panel { padding: 16px; }
  .match { font-size: 12px; }
  .match b { font-size: 16px; }
}
</style>
