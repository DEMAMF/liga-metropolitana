<section class="page hidden" id="admin">
  <div class="panel">
    <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2 style="margin:0">Panel de Administración</h2>
      <button class="alt" id="logout">Cerrar sesión</button>
    </div>
  </div>

  <div class="panel">
    <h3>Registrar nuevo club</h3>
    <form id="clubForm" class="form"><label>Nombre del club<input name="name" required maxlength="100"></label><div style="align-self:end"><button>Guardar club</button></div></form>
  </div>

  <div class="panel">
    <h3>Cargar resultado de partido</h3>
    <form id="matchForm" class="form">
      <label>Competencia
        <select name="competition_type" id="adminCompType" required>
          <option value="liga">Liga Regular (Torneo)</option>
          <option value="copa">Copa Anual 2026</option>
        </select>
      </label>
      <label>Categoría<select name="category_id" class="categories" required></select></label>
      <label>Fecha / Fase<input name="round" required placeholder="Ej.: Fecha 1 o Cuartos de Final"></label>
      <label>Día del partido<input name="match_date" type="date" required></label>
      <label>Local<select name="home_id" class="clubs" required></select></label>
      <label>Visitante<select name="away_id" class="clubs" required></select></label>
      <label>Goles local<input name="home_goals" type="number" min="0" required></label>
      <label>Goles visitante<input name="away_goals" type="number" min="0" required></label>
      <div class="wide" style="margin-top:8px"><button>Guardar y actualizar resultado</button></div>
    </form>

    <div style="margin-top:30px">
      <h4 style="color:var(--navy); margin-bottom:12px;">Partidos cargados (Liga y Copa)</h4>
      <div id="adminMatches"></div>
    </div>
  </div>

  <div class="panel">
    <h3>Registrar goles individuales</h3>
    <form id="scorerForm" class="form">
      <label>Jugador/a<input name="player" required></label>
      <label>Club<select name="club_id" class="clubs" required></select></label>
      <label>Categoría<select name="category_id" class="categories" required></select></label>
      <label>Goles<input name="goals" type="number" min="1" required></label>
      <div style="align-self:end"><button>Registrar gol</button></div>
    </form>
    <div id="adminScorers" style="margin-top:16px;"></div>
  </div>

  <div class="panel">
    <h3>Publicar comunicado institucional</h3>
    <form id="announcementForm" class="form" style="grid-template-columns:1fr">
      <label>Título<input name="title" required></label>
      <label>Contenido del comunicado<textarea name="body" required></textarea></label>
      <div><button>Publicar comunicado</button></div>
    </form>
    <div id="adminAnnouncements" style="margin-top:16px;"></div>
  </div>

  <div class="panel">
    <h3>Publicar documento oficial PDF</h3>
    <form id="documentForm" class="form">
      <label>Título del documento<input name="title" required maxlength="150" placeholder="Ej.: Resolución Tribunal"></label>
      <label>Tipo de documento<select name="doc_type" required><option value="">Seleccionar tipo</option><option value="tribunal">Tribunal de Disciplina</option><option value="reglamento">Reglamento</option><option value="circular">Circular oficial</option></select></label>
      <label>Torneo<input name="tournament" placeholder="Ej.: Clausura 2026"></label>
      <label>Fecha del documento<input name="doc_date" type="date" required></label>
      <label class="wide">Archivo PDF<input name="pdf" type="file" accept="application/pdf,.pdf" required></label>
      <div class="wide"><button type="submit">Subir documento PDF</button></div>
    </form>
    <div id="adminDocuments" style="margin-top:16px;">Cargando documentos...</div>
  </div>
</section>
