<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liga Metropolitana | Portal Oficial</title>
<style>
:root{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  color:#0f172a;
  background:#f8fafc;
  --navy:#0b223f;
  --blue:#0284c7;
  --sky:#38bdf8;
  --light-bg:#f1f5f9;
  --border:#e2e8f0;
  --muted:#64748b;
  --white:#ffffff;
  --shadow:0 4px 20px -2px rgba(15,23,42,.06),0 2px 6px -1px rgba(15,23,42,.04);
  --radius:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#f1f5f9 0,#f8fafc 300px,#f8fafc 100%);min-height:100vh}

header{
  background:linear-gradient(135deg,#071a30,#0f2e52 70%,#0284c7);
  color:#fff;
  padding:20px max(20px,calc((100vw - 1200px)/2));
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  box-shadow:0 4px 20px rgba(7,26,48,.15);
  border-bottom:3px solid var(--sky);
}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:14px;padding:6px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.brand strong{font-size:22px;letter-spacing:-.02em;display:block}
.brand small{color:#bae6fd;letter-spacing:.08em;text-transform:uppercase;font-size:11px;font-weight:600}

main{max-width:1200px;margin:auto;padding:30px 20px 50px}

.hero{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#0b223f,#0284c7);
  color:#fff;
  border-radius:var(--radius);
  padding:40px;
  margin-bottom:24px;
  box-shadow:var(--shadow);
}
.hero small{color:#7dd3fc;font-weight:700;letter-spacing:.15em;font-size:12px;text-transform:uppercase}
.hero h1{font-size:clamp(26px,4vw,40px);line-height:1.15;margin:10px 0 12px;letter-spacing:-.03em}
.hero p{color:#e0f2fe;font-size:15px;max-width:600px;margin:0;opacity:.9}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 24px;
  padding:8px;
  background:var(--white);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
button{
  background:var(--blue);
  border:0;
  border-radius:10px;
  padding:10px 18px;
  font-weight:600;
  cursor:pointer;
  color:#fff;
  transition:all .2s ease;
  font-size:14px;
}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}
button.alt{background:var(--light-bg);color:var(--navy);border:1px solid var(--border)}
button.alt:hover{background:#e2e8f0}
.tabs button{background:transparent;color:var(--muted);border:1px solid transparent;padding:10px 14px;font-weight:500}
.tabs button:hover{background:var(--light-bg);color:var(--navy)}
.tabs button.active{background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(11,34,63,.2);font-weight:600}
.hidden{display:none!important}

.panel{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:28px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.grid>div{background:linear-gradient(145deg,#fff,#f8fafc);border:1px solid var(--border);border-top:4px solid var(--blue);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.grid>div small{font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:11px}
.big{font-size:32px;font-weight:800;color:var(--navy);margin-top:6px;letter-spacing:-.02em}

.scroll{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:600px;background:#fff}
td,th{border-bottom:1px solid var(--border);padding:14px 16px;text-align:left;font-size:14px}
th{color:var(--navy);font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:var(--light-bg);font-weight:700}
tbody tr:hover{background:#f8fafc}
td.n,th.n{text-align:center}

.match-card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px 20px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.02);
  display:flex;
  flex-direction:column;
  gap:8px;
}
.match-main{display:flex;justify-content:space-between;align-items:center;gap:12px}
.match-team{flex:1;display:flex;align-items:center;gap:12px;font-weight:600;color:var(--navy)}
.match-team.home{justify-content:flex-end;text-align:right}
.match-team.away{justify-content:flex-start;text-align:left}
.match-score{
  background:var(--light-bg);
  border:1px solid var(--border);
  border-radius:10px;
  padding:8px 16px;
  font-size:18px;
  font-weight:800;
  color:var(--navy);
  min-width:70px;
  text-align:center;
}
.match-info{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);border-top:1px dashed var(--border);padding-top:8px;margin-top:2px}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--navy)}
input,select,textarea{background:#fff;color:var(--navy);border:1px solid var(--border);border-radius:10px;padding:12px;width:100%;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(2,132,199,.15)}
textarea{min-height:100px}
.wide{grid-column:1/-1}

.status{padding:14px 18px;border-radius:12px;background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd;margin-bottom:24px;font-weight:500;font-size:14px}
.error{background:#fee2e2;color:#991b1b;border-color:#fecaca}
footer{text-align:center;color:var(--muted);padding:30px 20px;border-top:1px solid var(--border);font-size:13px}

.club-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin:20px 0 10px}
.club-badge{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 10px;text-align:center;box-shadow:var(--shadow)}
.club-badge img{display:block;width:60px;height:60px;object-fit:contain;margin:0 auto 10px}
.club-badge strong{font-size:12px;color:var(--navy);display:block}

.section-kicker{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin-bottom:6px}
.club-cell{display:inline-flex;align-items:center;gap:10px}
.club-cell img{width:28px;height:28px;object-fit:contain;flex:none}

@media(max-width:768px){
  header{padding:14px 16px}
  .brand img{width:48px;height:48px}
  .brand strong{font-size:18px}
  .hero{padding:24px}
  .panel{padding:20px}
  .tabs{overflow-x:auto;padding:6px;flex-wrap:nowrap}
  .tabs button{white-space:nowrap;padding:8px 12px;font-size:13px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="https://raw.githubusercontent.com/DEMAMF/liga-amf/main/logo_liga.png" alt="Logo">
    <div><strong>LIGA METROPOLITANA</strong><small>Portal oficial · Temporada 2026</small></div>
  </div>

</header>
